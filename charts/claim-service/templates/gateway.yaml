{{- if .Values.gatewayAPI.enabled }}
{{- $src := (lookup "v1" "Secret" .Release.Namespace .Values.existingSecret) | default dict }}
{{- $data := $src.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claim-service.fullname" . }}-certificate
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required "tls.crt not found in existingSecret" (index $data "tls.crt") }}
  tls.key: {{ required "tls.key not found in existingSecret" (index $data "tls.key") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "claim-service.name" . }}-gateway
  namespace: {{ .Release.Namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gatewayAPI.gatewayClassName }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gatewayAPI.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "claim-service.fullname" . }}-certificate
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
{{- end }}
