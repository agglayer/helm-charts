apiVersion: v1
kind: Service
metadata:
  name: {{ include "claim-service.fullname" . }}-headless
  labels:
    {{- include "claim-service.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "claim-service.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "claim-service.fullname" . }}
  labels:
    {{- include "claim-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "claim-service.selectorLabels" . | nindent 4 }}
