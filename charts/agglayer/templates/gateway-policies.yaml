spec:
  targetRef:
    group: ""
    kind: Service
    name: {{ include "agglayer.fullname" . }}-admin
  default:
    checkIntervalSec: {{ .Values.gatewayAPI.healthCheck.admin.checkIntervalSec }}
    timeoutSec: {{ .Values.gatewayAPI.healthCheck.admin.timeoutSec }}
    healthyThreshold: {{ .Values.gatewayAPI.healthCheck.admin.healthyThreshold }}
    unhealthyThreshold: {{ .Values.gatewayAPI.healthCheck.admin.unhealthyThreshold }}
