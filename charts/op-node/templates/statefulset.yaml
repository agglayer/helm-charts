{{- $opSecrets := (lookup "v1" "Secret" .Release.Namespace .Values.existingSecret) }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "op-node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "op-node.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "op-node.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "op-node.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.container.image.repository }}:{{ .Values.container.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.container.image.pullPolicy }}
          command: 
            - op-node
          args:
            - --l2={{ .Values.config.l2.opGethAuthUrl }}
            - --l2.jwt-secret=/chainconfig/jwt.txt
            - --sequencer.enabled={{ .Values.config.sequencer.enabled }}
            - --p2p.no-discovery=true
            - --p2p.disable={{ not .Values.service.p2p.enabled }}
            {{- if .Values.service.p2p.enabled }}
            - --p2p.listen.tcp={{ .Values.service.p2p.port }}
            - --p2p.priv.path={{ .Values.storage.path }}/opnode_p2p_priv.txt
            {{- range .Values.service.p2p.static }}
            - --p2p.static={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.sequencer.enabled }}
            - --sequencer.l1-confs={{ .Values.config.sequencer.l1Confs }}
            - --p2p.sequencer.key={{ index $opSecrets.data "sequencer_private_key" | b64dec }}
            {{- end }}
            - --verifier.l1-confs={{ .Values.config.verifier.l1Confs }}
            {{- if and (not .Values.config.sequencer.enabled) .Values.config.verifier.sequencerHttp }}
            - --rollup.sequencer-http={{ .Values.config.verifier.sequencerHttp }}
            {{- end }}
            - --rollup.config=/chainconfig/rollup.json
            - --rpc.addr=0.0.0.0
            - --rpc.enable-admin
            - --l1={{ index $opSecrets.data "l1RpcURL" | b64dec }}
            - --l1.beacon={{ index $opSecrets.data "l1RpcURL" | b64dec }}
            {{- range .Values.config.extraOptions }}
            - --{{ . }}
            {{- end }}
            - --safedb.path=/data
          ports:
            - name: rpc
              containerPort: {{ .Values.service.rpc.port }}
              protocol: TCP
            {{- if .Values.service.p2p.enabled }}
            - name: p2p
              containerPort: {{ .Values.service.p2p.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: "/chainconfig"
              readOnly: true
            - mountPath: {{ .Values.storage.path | quote }}
              name: data
        {{- if .Values.autoRecover.enabled }}
        - name: auto-recover
          image: {{ .Values.autoRecover.image }}
          env:
            # Same pod, so this always reaches the local op-node regardless of Service DNS.
            - name: RPC_URL
              value: "http://localhost:{{ .Values.service.rpc.port }}"
            - name: CHECK_INTERVAL_SECONDS
              value: {{ .Values.autoRecover.checkIntervalSeconds | quote }}
            - name: STALE_THRESHOLD_SECONDS
              value: {{ .Values.autoRecover.staleThresholdSeconds | quote }}
          command:
            - sh
            - -c
            - |
              echo "$(date -u +%FT%TZ) auto-recover starting, installing curl+jq"
              apk add --no-cache curl jq
              echo "$(date -u +%FT%TZ) auto-recover ready, checking $RPC_URL every ${CHECK_INTERVAL_SECONDS}s (stale threshold ${STALE_THRESHOLD_SECONDS}s)"

              last_number=""
              last_change_time=$(date +%s)

              while true; do
                sleep "$CHECK_INTERVAL_SECONDS"

                status=$(curl -s -m 10 -X POST -H "Content-Type: application/json" \
                  --data '{"jsonrpc":"2.0","id":1,"method":"optimism_syncStatus","params":[]}' \
                  "$RPC_URL" || echo "")
                number=$(echo "$status" | jq -r '.result.unsafe_l2.number // empty')

                if [ -z "$number" ]; then
                  echo "$(date -u +%FT%TZ) failed to fetch sync status, skipping this round"
                  continue
                fi

                now=$(date +%s)

                if [ "$number" != "$last_number" ]; then
                  echo "$(date -u +%FT%TZ) unsafe_l2 at block $number, advancing normally"
                  last_number="$number"
                  last_change_time="$now"
                  continue
                fi

                stalled_for=$((now - last_change_time))
                if [ "$stalled_for" -ge "$STALE_THRESHOLD_SECONDS" ]; then
                  echo "$(date -u +%FT%TZ) unsafe_l2 stuck at block $number for ${stalled_for}s, calling admin_resetDerivationPipeline"
                  curl -s -m 10 -X POST -H "Content-Type: application/json" \
                    --data '{"jsonrpc":"2.0","id":1,"method":"admin_resetDerivationPipeline","params":[]}' \
                    "$RPC_URL"
                  echo ""
                  last_change_time="$now"
                fi
              done
          resources:
            {{- toYaml .Values.autoRecover.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ include "op-node.fullname" . }}
                  items:
                    - key: "rollup.json"
                      path: "rollup.json"
              - secret:
                  name: {{ .Values.existingSecret }}
                  items:
                    - key: "jwt"
                      path: "jwt.txt"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.storage.size }}
